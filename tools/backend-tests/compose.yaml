name: wdpl-backend-tests
services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: wdpl_admin_test_release
      MYSQL_USER: wdpl_test
      MYSQL_PASSWORD: disposable-test-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=disposable-test-only mysql -h 127.0.0.1 -u wdpl_test -D wdpl_admin_test_release -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [test]
  tests:
    build: .
    environment:
      WDPL_TEST_DB_HOST: database
      WDPL_TEST_DB_NAME: wdpl_admin_test_release
      WDPL_TEST_DB_USER: wdpl_test
      WDPL_TEST_DB_PASSWORD: disposable-test-only
    volumes:
      - ../../:/workspace:ro
    depends_on:
      database:
        condition: service_healthy
    networks: [test]
networks:
  test:
    internal: true
